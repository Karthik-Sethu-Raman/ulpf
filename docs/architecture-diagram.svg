<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- ULPF architecture diagram — SIH PS 26156 technical-approach slide.
       Light theme for the standard SIH template; hot path blue, cold path
       amber, drift violet. Doubles as the M4 architecture-doc figure. -->
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g font-family="Segoe UI, Arial, sans-serif">

  <!-- canvas -->
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- caption -->
  <text x="40" y="50" font-size="22" font-weight="bold" fill="#0f172a">ULPF — Universal Log Pre-processing Framework</text>
  <text x="40" y="74" font-size="14" fill="#64748b">lossless ingest · fingerprinting · OCSF normalization · human-gated onboarding · fail-closed drift</text>

  <!-- hot path section label -->
  <rect x="40" y="104" width="4" height="18" fill="#1d4ed8"/>
  <text x="52" y="118" font-size="15"><tspan font-weight="bold" fill="#1d4ed8">HOT PATH</tspan><tspan fill="#475569"> — deterministic · no AI per-event</tspan></text>

  <!-- ============ devices ============ -->
  <g>
    <rect x="40" y="170" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="115" y="202" font-size="14" text-anchor="middle" fill="#0f172a">Firewall</text>
    <rect x="40" y="240" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="115" y="272" font-size="14" text-anchor="middle" fill="#0f172a">IDS / IPS</text>
    <rect x="40" y="310" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="115" y="342" font-size="14" text-anchor="middle" fill="#0f172a">Any appliance</text>
    <text x="115" y="384" font-size="12" font-style="italic" text-anchor="middle" fill="#64748b">any perimeter device</text>
  </g>
  <g stroke="#1d4ed8" stroke-width="2">
    <line x1="190" y1="196" x2="224" y2="210" marker-end="url(#arrowBlue)"/>
    <line x1="190" y1="266" x2="224" y2="255" marker-end="url(#arrowBlue)"/>
    <line x1="190" y1="336" x2="224" y2="300" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- ============ collector ============ -->
  <rect x="230" y="180" width="210" height="140" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="210" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">Collector</text>
  <text x="335" y="234" font-size="13" text-anchor="middle" fill="#334155">syslog UDP/TCP · :5514</text>
  <text x="335" y="254" font-size="13" text-anchor="middle" fill="#334155">HTTP POST · :8080</text>
  <text x="335" y="274" font-size="13" text-anchor="middle" fill="#334155">zero parsing — wraps raw</text>
  <text x="335" y="296" font-size="12" font-style="italic" text-anchor="middle" fill="#64748b">every line → envelope → topic</text>

  <line x1="440" y1="250" x2="476" y2="250" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- ============ raw.logs topic ============ -->
  <rect x="480" y="224" width="180" height="64" rx="32" fill="#334155"/>
  <text x="570" y="252" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">raw.logs</text>
  <text x="570" y="272" font-size="11" text-anchor="middle" fill="#cbd5e1">6 partitions · replay-safe</text>
  <text x="570" y="306" font-size="12" text-anchor="middle" fill="#64748b">Redpanda — Kafka protocol</text>

  <line x1="660" y1="250" x2="686" y2="250" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- ============ pipeline workers ============ -->
  <rect x="690" y="150" width="310" height="280" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow)"/>
  <text x="845" y="182" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">Pipeline workers</text>
  <rect x="780" y="196" width="130" height="22" rx="11" fill="#dbeafe"/>
  <text x="845" y="211" font-size="12" text-anchor="middle" fill="#1d4ed8">×N · consumer group</text>

  <circle cx="716" cy="240" r="13" fill="#1d4ed8"/>
  <text x="716" y="245" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
  <text x="740" y="238" font-size="14.5" font-weight="bold" fill="#0f172a">persist raw FIRST</text>
  <text x="740" y="257" font-size="12" fill="#64748b">immutable rows · Merkle hash chain</text>

  <circle cx="716" cy="295" r="13" fill="#1d4ed8"/>
  <text x="716" y="300" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
  <text x="740" y="293" font-size="14.5" font-weight="bold" fill="#0f172a">fingerprint — any format</text>
  <text x="740" y="312" font-size="12" fill="#64748b">known formats + shape-hash families</text>

  <circle cx="716" cy="350" r="13" fill="#1d4ed8"/>
  <text x="716" y="355" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
  <text x="740" y="348" font-size="14.5" font-weight="bold" fill="#0f172a">apply active rule → OCSF</text>
  <text x="740" y="367" font-size="12" fill="#64748b">unknown → samples · errors → DLQ</text>

  <line x1="1000" y1="250" x2="1036" y2="250" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- ============ normalized.events topic ============ -->
  <rect x="1040" y="224" width="220" height="64" rx="32" fill="#334155"/>
  <text x="1150" y="252" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">normalized.events</text>
  <text x="1150" y="272" font-size="11" text-anchor="middle" fill="#cbd5e1">keyed by fingerprint</text>

  <line x1="1260" y1="250" x2="1286" y2="250" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- ============ drift worker ============ -->
  <rect x="1290" y="150" width="270" height="230" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="1425" y="180" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">Drift worker</text>
  <text x="1425" y="202" font-size="12" text-anchor="middle" fill="#64748b">watches rule health per fingerprint</text>
  <text x="1425" y="234" font-size="13" text-anchor="middle" fill="#334155">tier-1 invariants — from event 0</text>
  <text x="1425" y="256" font-size="13" text-anchor="middle" fill="#334155">tier-2 statistical vs baseline</text>
  <line x1="1310" y1="276" x2="1540" y2="276" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1425" y="300" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7c3aed">FAIL-CLOSED</text>
  <text x="1425" y="322" font-size="13" text-anchor="middle" fill="#334155">field quarantine · rule deactivate</text>
  <text x="1425" y="344" font-size="13" text-anchor="middle" fill="#334155">→ re-enters onboarding</text>

  <!-- drift actions → rules -->
  <path d="M 1350,380 L 1350,500 L 940,500 L 940,556" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowViolet)"/>
  <text x="1145" y="492" font-size="12" text-anchor="middle" fill="#7c3aed">quarantine field · deactivate rule</text>

  <!-- pipeline → postgres -->
  <line x1="845" y1="430" x2="845" y2="556" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="833" y="500" font-size="12" text-anchor="end" fill="#1d4ed8">raw-first persist</text>

  <!-- ============ cold path section label ============ -->
  <rect x="40" y="516" width="4" height="18" fill="#b45309"/>
  <text x="52" y="530" font-size="15"><tspan font-weight="bold" fill="#b45309">COLD PATH</tspan><tspan fill="#475569"> — AI-assisted · human-gated · rules are data, never code</tspan></text>

  <!-- samples: pipeline → onboarding -->
  <path d="M 720,430 L 720,468 L 200,468 L 200,566" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  <text x="450" y="460" font-size="12.5" text-anchor="middle" fill="#b45309">unknown-format samples</text>

  <!-- ============ onboarding service ============ -->
  <rect x="40" y="570" width="320" height="280" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="600" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">Onboarding service</text>
  <text x="200" y="621" font-size="12" text-anchor="middle" fill="#64748b">triggers when samples pile up, no active rule</text>
  <text x="60" y="650" font-size="13" fill="#334155">· sample split — 5 prompt / 15 held-out</text>
  <text x="60" y="672" font-size="13" fill="#334155">· SLM drafts candidate rule</text>
  <text x="60" y="694" font-size="13" fill="#334155">· deterministic validation gate</text>
  <text x="60" y="716" font-size="13" fill="#334155">· candidate → pending_review</text>
  <rect x="60" y="736" width="280" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="200" y="758" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#92400e">Ollama — Qwen3 4B / 8B tiers · offline</text>
  <text x="200" y="776" font-size="11" font-style="italic" text-anchor="middle" fill="#b45309">cold path only — never per-event</text>
  <text x="200" y="826" font-size="11" font-style="italic" text-anchor="middle" fill="#64748b">fail-closed: pends on SLM outage</text>

  <!-- onboarding → review -->
  <line x1="360" y1="690" x2="396" y2="690" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- ============ human review ============ -->
  <rect x="400" y="600" width="140" height="180" rx="10" fill="#0f172a" filter="url(#shadow)"/>
  <text x="470" y="636" font-size="20" text-anchor="middle" fill="#fbbf24">★</text>
  <text x="470" y="664" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">HUMAN</text>
  <text x="470" y="686" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">REVIEW</text>
  <text x="470" y="712" font-size="12" text-anchor="middle" fill="#cbd5e1">approve · edit</text>
  <text x="470" y="728" font-size="12" text-anchor="middle" fill="#cbd5e1">override</text>
  <rect x="415" y="744" width="110" height="24" rx="12" fill="#b45309"/>
  <text x="470" y="760" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#ffffff">no auto-approve</text>
  <text x="470" y="798" font-size="11.5" text-anchor="middle" fill="#b45309">approve → rule v2 live</text>
  <text x="470" y="814" font-size="11.5" text-anchor="middle" fill="#b45309">backlog re-parses</text>

  <!-- review → postgres -->
  <line x1="540" y1="690" x2="576" y2="690" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- ============ postgres ============ -->
  <rect x="580" y="560" width="430" height="300" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="590" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">PostgreSQL — event store &amp; control plane</text>
  <text x="795" y="611" font-size="12" text-anchor="middle" fill="#64748b">least-privilege roles · pipelines are INSERT-only</text>

  <rect x="605" y="628" width="196" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="703" y="650" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">raw_events</text>
  <text x="703" y="668" font-size="11.5" text-anchor="middle" fill="#64748b">INSERT-only · daily partitions</text>

  <rect x="811" y="628" width="196" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="909" y="650" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">raw_batches</text>
  <text x="909" y="668" font-size="11.5" text-anchor="middle" fill="#64748b">per-partition hash chain</text>

  <rect x="605" y="694" width="196" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="703" y="716" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">normalized_events</text>
  <text x="703" y="734" font-size="11.5" text-anchor="middle" fill="#64748b">append-only · versioned</text>

  <rect x="811" y="694" width="196" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="909" y="716" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">rules</text>
  <text x="909" y="734" font-size="11.5" text-anchor="middle" fill="#64748b">immutable versions · 1 active</text>

  <rect x="605" y="760" width="196" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="703" y="782" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">audit_log</text>
  <text x="703" y="800" font-size="11.5" text-anchor="middle" fill="#64748b">every transition</text>

  <rect x="811" y="760" width="196" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="909" y="782" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">onboarding_samples</text>
  <text x="909" y="800" font-size="11.5" text-anchor="middle" fill="#64748b">prompt · held-out · unused</text>

  <!-- postgres → dashboard -->
  <line x1="1010" y1="640" x2="1286" y2="640" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="1150" y="630" font-size="12" text-anchor="middle" fill="#64748b">current view · stats · audit</text>

  <!-- postgres → exports -->
  <line x1="1010" y1="800" x2="1286" y2="800" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- ============ dashboard ============ -->
  <rect x="1290" y="560" width="270" height="160" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="1425" y="588" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">Gateway + Dashboard</text>
  <text x="1425" y="610" font-size="12.5" text-anchor="middle" fill="#334155">FastAPI gateway · React UI</text>
  <text x="1425" y="634" font-size="12.5" text-anchor="middle" fill="#334155">live feed · Review Queue</text>
  <text x="1425" y="658" font-size="12.5" text-anchor="middle" fill="#334155">rules · drift &amp; health · audit</text>
  <text x="1425" y="690" font-size="11" font-style="italic" text-anchor="middle" fill="#64748b">self-hosted assets (air-gap)</text>

  <!-- ============ exports ============ -->
  <rect x="1290" y="750" width="270" height="110" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <text x="1425" y="778" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Exports</text>
  <text x="1425" y="800" font-size="12.5" text-anchor="middle" fill="#334155">OCSF JSONL · Parquet</text>
  <text x="1425" y="822" font-size="12.5" text-anchor="middle" fill="#475569">→ SIEM · data lake</text>

  <!-- footer -->
  <line x1="40" y1="872" x2="1560" y2="872" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="892" font-size="12.5" fill="#64748b">Air-gap native — offline SLM (Ollama) · self-hosted UI assets · docker-compose bundle (tars) · Redpanda speaks the Kafka protocol</text>

  </g>
</svg>
