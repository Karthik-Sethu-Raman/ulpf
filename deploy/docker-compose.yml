# deploy/docker-compose.yml — M1 profile. Ollama/onboarding join in M2.
name: ulpf
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: ulpf }
    # Host port 5433, NOT 5432: dev boxes with a native Postgres service own
    # 5432, and host connections would silently hit that one instead. Only the
    # published port changes; the compose network keeps postgres:5432.
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d ulpf"], interval: 3s, retries: 20 }
  migrate:
    build: { context: .., dockerfile: deploy/migrate.Dockerfile }
    environment: { ADMIN_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ulpf }
    depends_on: { postgres: { condition: service_healthy } }
  seed:
    build: { context: .., dockerfile: deploy/seed.Dockerfile }
    # pipeline_role is SELECT-only on rules — seeding runs as the admin,
    # after migrations (controller R18). Validated at load: a broken seed
    # exits 1 and loads nothing; a re-run is a no-op (ON CONFLICT).
    environment: { ADMIN_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ulpf }
    restart: "no"
    depends_on: { migrate: { condition: service_completed_successfully } }
  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command: [ redpanda, start, --overprovisioned, --smp, "1", --memory, 1G,
               --kafka-addr, "PLAINTEXT://0.0.0.0:9092", --advertise-kafka-addr, "PLAINTEXT://redpanda:9092" ]
    ports: ["9092:9092"]
    healthcheck: { test: ["CMD", "rpk", "cluster", "info"], interval: 5s, retries: 20 }
  topics:
    image: redpandadata/redpanda:v24.1.7
    depends_on: { redpanda: { condition: service_healthy } }
    # rpk defaults to 127.0.0.1:9092, which is not the broker from this container.
    environment: { RPK_BROKERS: redpanda:9092 }
    entrypoint: [ "/bin/sh", "-c", "/init.sh" ]
    volumes: [ ./redpanda-init.sh:/init.sh ]
  collector:
    build: { context: .., dockerfile: services/collector/Dockerfile }
    environment: { KAFKA_BOOTSTRAP: redpanda:9092 }
    ports: ["5514:5514/udp", "5514:5514", "8080:8080"]
    depends_on: { topics: { condition: service_completed_successfully } }
  # M1: exactly ONE pipeline replica — batch_seq = MAX+1 per partition is only
  # safe with a single consumer per partition (spec §4). Scale-out needs zombie
  # fencing and epoch-based batch_seq before it is correctness-safe (M3).
  pipeline:
    build: { context: .., dockerfile: services/pipeline/Dockerfile }
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      DATABASE_URL: postgresql://pipeline_role:pipeline_dev@postgres:5432/ulpf
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully }, topics: { condition: service_completed_successfully }, seed: { condition: service_completed_successfully } }
  gateway:
    build: { context: .., dockerfile: services/gateway/Dockerfile }
    environment:
      DATABASE_URL: postgresql://gateway_role:gateway_dev@postgres:5432/ulpf
      # M2 write path (Task 7): lifecycle mutations as the least-privilege
      # rules_role; reads keep the read-only gateway_role DSN above.
      WRITE_DATABASE_URL: postgresql://rules_role:rules_dev@postgres:5432/ulpf
    ports: ["8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  web:
    build: { context: .., dockerfile: web/Dockerfile }
    ports: ["3000:3000"]
    depends_on: [ gateway ]
  simulator:
    profiles: [ sim ]
    build: { context: .., dockerfile: simulator/Dockerfile }
    environment: { COLLECTOR_UDP: collector:5514, COLLECTOR_HTTP: http://collector:8080 }
    depends_on: [ collector ]
  # M2 onboarding (cold path): polls onboarding_samples, splits 5/15, asks the
  # SLM for a candidate rule, validates it, stores it as pending_review. The
  # SLM tier is picked by profile: --profile slm-4b (default, 8GB boxes) or
  # --profile slm-8b (16GB) + ULPF_OLLAMA_URL/ULPF_OLLAMA_MODEL in deploy/.env
  # pointing at ollama-8b. Fail-closed: with no SLM reachable the loop logs
  # and retries — the hot path is never touched.
  onboarding:
    build: { context: .., dockerfile: services/onboarding/Dockerfile }
    environment:
      DATABASE_URL: postgresql://onboarding_role:onboarding_dev@postgres:5432/ulpf
      OLLAMA_URL: ${ULPF_OLLAMA_URL:-http://ollama-4b:11434}
      OLLAMA_MODEL: ${ULPF_OLLAMA_MODEL:-qwen3:4b}
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully } }
  # Ollama sidecars. No host port by design: only the onboarding service talks
  # to them, inside the compose network. The entrypoint serves, then blocks on
  # `ollama pull` until the tier's model is local, then waits on serve.
  ollama-4b:
    image: ollama/ollama:0.34.2
    profiles: [ slm-4b ]
    entrypoint: [ "/bin/sh", "/entrypoint.sh" ]
    environment: { MODEL: "qwen3:4b" }
    volumes:
      - ollama4:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh:ro
  ollama-8b:
    image: ollama/ollama:0.34.2
    profiles: [ slm-8b ]
    entrypoint: [ "/bin/sh", "/entrypoint.sh" ]
    environment: { MODEL: "qwen3:8b" }
    volumes:
      - ollama8:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh:ro
volumes: { pgdata: {}, ollama4: {}, ollama8: {} }
